[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bewaesserung"
version = "0.1.0"
description = "Bewässerungssteuerung für das Gardena smart system auf dem Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=2.8",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
bewaesserung = "bewaesserung.dienst:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
